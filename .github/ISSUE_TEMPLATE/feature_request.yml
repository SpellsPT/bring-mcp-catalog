name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward today? Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the MCP server itself, not about Bring's own app or API behaviour
